<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ótica La Patrícia - Cadastrar Médico</title>
    <link rel="icon" type="image/png" href="la pipita.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // Aplica o tema salvo antes de carregar para evitar piscar a tela
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="flex flex-col min-h-screen pb-20 transition-colors duration-200">

    <header class="app-header shadow-md sticky top-0 z-20 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="opacity-70 hover:opacity-100 mr-1"><i class="fa-solid fa-arrow-left text-base"></i></a>
            <div>
                <h1 id="header-title" class="font-bold text-base tracking-tight">Cadastrar Novo Médico</h1>
                <p class="text-xs opacity-70">Ótica La Patrícia</p>
            </div>
        </div>
        <a href="settings.html" class="opacity-70 hover:opacity-100 transition">
            <i class="fa-solid fa-gear text-xl"></i>
        </a>
    </header>

    <main class="flex-1 overflow-y-auto p-4 max-w-2xl mx-auto w-full space-y-4">
        <div class="app-card p-5 rounded-2xl shadow-sm border">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-200 dark:border-slate-700">
                <h2 id="form-doctor-title" class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-user-doctor text-amber-600 dark:text-amber-500"></i> Informações do Médico
                </h2>
                <span class="text-xs bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 font-medium px-2.5 py-1 rounded-full">Campos Opcionais</span>
            </div>

            <form id="formNovoMedico" onsubmit="addApp.saveDoctor(event)" class="space-y-4 text-sm">
                <input type="hidden" id="doctorEditId">
                
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Gênero / Tratamento</label>
                    <div class="flex items-center gap-4 app-input p-2.5 border rounded-xl">
                        <label class="flex items-center gap-2 cursor-pointer font-medium">
                            <input type="radio" name="gender" value="Dr." checked class="text-amber-600 focus:ring-amber-500 h-4 w-4"> Homem (Dr.)
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer font-medium">
                            <input type="radio" name="gender" value="Dra." class="text-amber-600 focus:ring-amber-500 h-4 w-4"> Mulher (Dra.)
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Nome Completo <span class="text-rose-500">*</span></label>
                    <input type="text" id="name" placeholder="Ex: Carlos Eduardo Silva" required class="w-full px-3.5 py-2.5 app-input border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">CRM (Identificador único) <span class="text-rose-500">*</span></label>
                    <input type="text" id="crm" placeholder="Ex: 54321-MG" required class="w-full px-3.5 py-2.5 app-input border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Especialização</label>
                    <select id="specialization" class="w-full px-3.5 py-2.5 app-input border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                        <option value="">Selecione...</option>
                        <option value="Oftalmo Adulto e Idoso">Oftalmo Adulto e Idoso</option>
                        <option value="Oftalmo Adulto">Oftalmo Adulto</option>
                        <option value="Oftalmo Adulto e Criança">Oftalmo Adulto e Criança</option>
                        <option value="Oftalmopediatria">Oftalmopediatria</option>
                        <option value="Oftalmogeriatria">Oftalmogeriatria</option>
                        <option value="Optometrista">Optometrista</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Subespecializações</label>
                    <div id="subspec-tags" class="flex flex-wrap gap-2 p-3 app-input border rounded-xl"></div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Aniversário</label>
                        <div class="grid grid-cols-2 gap-2">
                            <select id="dobDay" class="w-full px-3 py-2.5 app-input border rounded-xl text-xs font-medium">
                                <option value="">Dia</option>
                            </select>
                            <select id="dobMonth" class="w-full px-3 py-2.5 app-input border rounded-xl text-xs font-medium">
                                <option value="">Mês</option>
                                <option value="01">Janeiro</option><option value="02">Fevereiro</option><option value="03">Março</option><option value="04">Abril</option><option value="05">Maio</option><option value="06">Junho</option><option value="07">Julho</option><option value="08">Agosto</option><option value="09">Setembro</option><option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Data da Visita</label>
                        <input type="date" id="visitDate" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                    </div>
                </div>

                <div class="app-input p-4 border rounded-xl space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="text-xs font-semibold uppercase tracking-wider opacity-80">Horários de Atendimento</label>
                        <button type="button" onclick="addApp.adicionarHorarioLinha()" class="text-xs bg-amber-600 dark:bg-amber-500 text-white font-semibold px-3 py-1.5 rounded-lg hover:bg-amber-700 dark:hover:bg-amber-600 transition flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> Adicionar Horário
                        </button>
                    </div>
                    <div id="horariosContainer" class="space-y-2"></div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Clínica Vinculada</label>
                    <select id="selectHospital" class="w-full px-3.5 py-2.5 app-input border rounded-xl"></select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Andar / Consultório</label>
                        <input type="text" id="room" placeholder="Ex: Sala 402" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Telefone Comercial</label>
                        <input type="text" id="phone" placeholder="Ex: (31) 3222-1122" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">WhatsApp Comercial</label>
                        <input type="text" id="cellphone" placeholder="Ex: (31) 99887-7665" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Telefone do Médico</label>
                        <input type="text" id="personalPhone" placeholder="Ex: (31) 98888-1111" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Secretária(s)</label>
                        <input type="text" id="secretary" placeholder="Ex: Maria" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Já Indica a Ótica?</label>
                    <div class="flex items-center gap-3 app-input p-2.5 border rounded-xl flex-wrap">
                        <label class="flex items-center gap-1.5 cursor-pointer font-medium text-xs"><input type="radio" name="indicates" value="sim" class="text-amber-600"> Indica</label>
                        <label class="flex items-center gap-1.5 cursor-pointer font-medium text-xs"><input type="radio" name="indicates" value="nao" class="text-amber-600"> Não Indica</label>
                        <label class="flex items-center gap-1.5 cursor-pointer font-medium text-xs"><input type="radio" name="indicates" value="deixou" class="text-amber-600"> Deixou de indicar</label>
                    </div>
                </div>

                <!-- Presente Habitual e Presente Especial lado a lado -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Presente Habitual</label>
                        <select id="present" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                            <option value="">Selecione...</option>
                            <option value="Kit adulto">Kit adulto</option>
                            <option value="Kit infantil">Kit infantil</option>
                            <option value="Não precisou de cartoes">Não precisou de cartoes</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Presente Especial</label>
                        <select id="specialPresent" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                            <option value="">Selecione...</option>
                            <option value="Limpa lentes">Limpa lentes</option>
                            <option value="Flanela">Flanela</option>
                            <option value="Vinho">Vinho</option>
                            <option value="Avantim">Avantim</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Responsável</label>
                        <select id="responsible" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                            <option value="">Selecione...</option>
                            <option value="Kelen Mesquita">Kelen Mesquita</option>
                            <option value="Vitório Quites">Vitório Quites</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Status Atendimento</label>
                        <select id="status" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                            <option value="">Selecione...</option>
                            <option value="Visitar">Visitar</option>
                            <option value="Concluído">Concluído</option>
                            <option value="Rota de visita">Rota de visita</option>
                            <option value="Não recebeu/Remarcar">Não recebeu/Remarcar</option>
                            <option value="Férias">Férias</option>
                            <option value="Licença">Licença</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Potencial</label>
                        <select id="lastIndicationDate" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                            <option value="">Selecione...</option>
                            <option value="Alto">Alto</option>
                            <option value="Médio">Médio</option>
                            <option value="Baixo">Baixo</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Unidade Próxima</label>
                    <select id="nearbyUnit" class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                        <option value="">Selecione...</option>
                        <option value="BRASIL 80 - SANTA EFIGÊNIA">BRASIL 80 - SANTA EFIGÊNIA</option>
                        <option value="BRASIL 685 - FUNCIONÁRIOS">BRASIL 685 - FUNCIONÁRIOS</option>
                        <option value="CONTORNO 4679 - SERRA">CONTORNO 4679 - SERRA</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Observações</label>
                    <textarea id="notes" rows="3" class="w-full px-3.5 py-2.5 app-input border rounded-xl"></textarea>
                </div>

                <div class="flex gap-2 pt-1">
                    <button type="submit" class="flex-1 app-header font-semibold py-3 rounded-xl transition shadow-md flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk text-amber-400"></i> Salvar Médico Completo
                    </button>
                    <a href="index.html" class="app-btn-secondary font-semibold px-4 py-3 rounded-xl transition text-xs flex items-center justify-center">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>

    <div id="modalAlerta" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="app-card w-full max-w-sm rounded-2xl shadow-2xl p-6 text-center space-y-4 border">
            <h4 id="alertaTitulo" class="font-bold text-base">Aviso</h4>
            <p id="alertaTexto" class="text-xs opacity-80 leading-relaxed"></p>
            <button onclick="addApp.fecharAlerta()" class="w-full app-header font-semibold py-2.5 rounded-xl text-xs">Entendido</button>
        </div>
    </div>

    <script src="app.js"></script>

    <script>
        const SUPABASE_URL = 'https://qhtwbbrapldxidlqikzf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodHdiYnJhcGxkeGlkbHFpa3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNDA1OTgsImV4cCI6MjEwMTgxNjU5OH0.nhHFnhPvSdhl9z38OX0V6wqDCYaF9-Y8T4PgEfFcw80';
        let supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        const SUBESPECIALIDADES_LISTA = [
            "Ametropia", "Ambliopia", "Astigmatismo", "Baixa Visão", 
            "Blefaroplastia", "Catarata", "Ceratocone", "Córnea", 
            "Dioptrias", "Diplopia", "Doenças externas", "Doenças Oculares",
            "Erros de refração", "Estrabismo", "Glaucoma", "Hipermetropia",
            "Lentes de Contato", "Mácula", "Miopia", "Neuro-oftalmologia",
            "Oncologia Ocular", "Orbita", "Plástica Ocular", "Presbiopia",
            "Refrativa", "Refratometria", "Retina", "Urgência", "Uveite", 
            "Vias lacrimais", "Vítreo", "Visão Subnormal", "Patologias neonatal",
            "Progressão de miopia", "Teste do olinho", "Exoftalmia",
            "Alteração dos músculos oculares", "Traumas oculares",
            "Pterígio", "Olho seco"
        ];

        class AddApp {
            constructor() {
                this.clinics = [];
                this.doctors = [];
                this.initDobDays();
                this.initSubspecTags();
                this.loadDataAndCheckEdit();
            }

            initDobDays() {
                const daySelect = document.getElementById('dobDay');
                if(!daySelect) return;
                let html = '<option value="">Dia</option>';
                for(let i = 1; i <= 31; i++) {
                    const diaStr = i < 10 ? '0' + i : '' + i;
                    html += `<option value="${diaStr}">${i}</option>`;
                }
                daySelect.innerHTML = html;
            }

            initSubspecTags() {
                const container = document.getElementById('subspec-tags');
                if(!container) return;
                let html = '';
                SUBESPECIALIDADES_LISTA.forEach((sub) => {
                    html += `
                        <label class="inline-flex items-center gap-1.5 app-card border px-3 py-1.5 rounded-lg text-xs cursor-pointer hover:border-amber-400 transition select-none">
                            <input type="checkbox" name="subspecialties" value="${sub}" class="text-amber-600 h-3.5 w-3.5 rounded">
                            <span class="font-medium">${sub}</span>
                        </label>
                    `;
                });
                container.innerHTML = html;
            }

            adicionarHorarioLinha(diaPre = '2ª', periodoPre = 'M') {
                const container = document.getElementById('horariosContainer');
                if(!container) return;
                const linhaId = 'horario_' + Date.now() + Math.floor(Math.random()*1000);
                
                const div = document.createElement('div');
                div.id = linhaId;
                div.className = "flex items-center gap-2 app-card p-2.5 rounded-xl border";
                div.innerHTML = `
                    <select class="horario-dia flex-1 app-input border rounded-lg p-1.5 text-xs font-semibold">
                        <option value="2ª" ${diaPre==='2ª'?'selected':''}>Segunda</option>
                        <option value="3ª" ${diaPre==='3ª'?'selected':''}>Terça</option>
                        <option value="4ª" ${diaPre==='4ª'?'selected':''}>Quarta</option>
                        <option value="5ª" ${diaPre==='5ª'?'selected':''}>Quinta</option>
                        <option value="6ª" ${diaPre==='6ª'?'selected':''}>Sexta</option>
                        <option value="2ª à 6ª" ${diaPre==='2ª à 6ª'?'selected':''}>De Segunda à Sexta</option>
                    </select>
                    <select class="horario-periodo flex-1 app-input border rounded-lg p-1.5 text-xs font-semibold">
                        <option value="M" ${periodoPre.includes('Manhã')?'selected':''}>Manhã</option>
                        <option value="T" ${periodoPre.includes('Tarde')?'selected':''}>Tarde</option>
                        <option value="M e T" ${periodoPre.includes('Manhã e Tarde')?'selected':''}>Manhã e Tarde</option>
                    </select>
                    <button type="button" onclick="document.getElementById('${linhaId}').remove()" class="text-rose-500 p-1.5 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                `;
                container.appendChild(div);
            }

            async loadDataAndCheckEdit() {
                try {
                    if (supabaseClient) {
                        const [resClinicas, resMedicos] = await Promise.all([
                            supabaseClient.from('clinics').select('*'),
                            supabaseClient.from('doctors').select('*')
                        ]);
                        if (!resClinicas.error && resClinicas.data) {
                            this.clinics = resClinicas.data.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'pt-BR', { sensitivity: 'accent' }));
                        }
                        if (!resMedicos.error && resMedicos.data) this.doctors = resMedicos.data;
                    }
                    this.preencherSelectClinicas();

                    const urlParams = new URLSearchParams(window.location.search);
                    const editId = urlParams.get('id');
                    if (editId) {
                        const d = this.doctors.find(item => String(item.id) === String(editId));
                        if (d) this.prepararEdicao(d);
                    }
                } catch(e) { console.error(e); }
            }

            preencherSelectClinicas(selectedName = '') {
                const select = document.getElementById('selectHospital');
                if(!select) return;
                let html = '<option value=" ">Selecione a Clínica...</option>';
                this.clinics.forEach(c => {
                    const sel = (c.name === selectedName) ? 'selected' : '';
                    html += `<option value="${c.name}" ${sel}>${c.name} - ${c.address}</option>`;
                });
                select.innerHTML = html;
            }

            prepararEdicao(d) {
                document.getElementById('header-title').textContent = 'Editar Médico';
                document.getElementById('form-doctor-title').innerHTML = '<i class="fa-solid fa-user-pen text-amber-600 dark:text-amber-500"></i> Editar Informações';
                document.getElementById('doctorEditId').value = d.id;

                let limpoNome = d.name ? d.name.replace('Dr. ', '').replace('Dra. ', '') : '';
                document.getElementById('name').value = limpoNome !== ' ' ? limpoNome : '';
                document.getElementById('crm').value = (d.crm && d.crm !== ' ') ? d.crm : '';
                document.getElementById('specialization').value = (d.specialization && d.specialization !== ' ') ? d.specialization : '';
                document.getElementById('room').value = (d.room && d.room !== ' ') ? d.room : '';
                document.getElementById('phone').value = (d.phone && d.phone !== ' ') ? d.phone : '';
                document.getElementById('cellphone').value = (d.cellphone && d.cellphone !== ' ') ? d.cellphone : '';
                document.getElementById('personalPhone').value = (d.personalPhone && d.personalPhone !== ' ') ? d.personalPhone : '';
                document.getElementById('secretary').value = (d.secretary && d.secretary !== ' ') ? d.secretary : '';
                document.getElementById('notes').value = (d.notes && d.notes !== ' ') ? d.notes : '';
                if(d.present && d.present !== ' ') document.getElementById('present').value = d.present;
                if(d.specialPresent && d.specialPresent !== ' ') document.getElementById('specialPresent').value = d.specialPresent;
                if(d.responsible && d.responsible !== ' ') document.getElementById('responsible').value = d.responsible;
                if(d.status && d.status !== ' ') document.getElementById('status').value = d.status;
                if(d.nearbyUnit && d.nearbyUnit !== ' ') document.getElementById('nearbyUnit').value = d.nearbyUnit;

                if (d.visitDate && d.visitDate !== ' ' && d.visitDate.includes('/')) {
                    const partes = d.visitDate.split('/');
                    if(partes.length === 3) {
                        document.getElementById('visitDate').value = `${partes[2]}-${partes[1]}-${partes[0]}`;
                    }
                } else if (d.visitDate && d.visitDate !== ' ') {
                    document.getElementById('visitDate').value = d.visitDate;
                }

                if (d.lastIndicationDate && d.lastIndicationDate !== ' ') {
                    document.getElementById('lastIndicationDate').value = d.lastIndicationDate;
                }

                if (d.subspecialties && d.subspecialties !== ' ') {
                    const listaSalva = d.subspecialties.split(',').map(s => s.trim());
                    document.querySelectorAll('input[name="subspecialties"]').forEach(chk => {
                        if (listaSalva.includes(chk.value)) {
                            chk.checked = true;
                        }
                    });
                }

                if(d.birthdate && d.birthdate !== ' ') {
                    const partes = d.birthdate.split('-');
                    if(partes.length === 3) {
                        document.getElementById('dobMonth').value = partes[1];
                        document.getElementById('dobDay').value = partes[2];
                    } else if(partes.length === 2) {
                        document.getElementById('dobDay').value = partes[0];
                        document.getElementById('dobMonth').value = partes[1];
                    }
                }

                if(d.schedules && d.schedules !== ' ') {
                    try {
                        const parsed = typeof d.schedules === 'string' ? JSON.parse(d.schedules) : d.schedules;
                        if(Array.isArray(parsed)) {
                            parsed.forEach(h => this.adicionarHorarioLinha(h.dia, h.periodo));
                        }
                    } catch(e) { console.error("Erro ao carregar horários", e); }
                }

                if(d.name && d.name.startsWith('Dra.')) {
                    const radioDra = document.querySelector('input[name="gender"][value="Dra."]');
                    if(radioDra) radioDra.checked = true;
                }

                if(d.indicates && d.indicates !== ' ') {
                    const radio = document.querySelector(`input[name="indicates"][value="${d.indicates}"]`);
                    if(radio) radio.checked = true;
                }

                this.preencherSelectClinicas(d.hospital);
            }

            normalizarTexto(texto) {
                if (!texto) return '';
                return texto
                    .toLowerCase()
                    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                    .replace(/\s+/g, '');
            }

            async saveDoctor(e) {
                e.preventDefault();
                const editId = document.getElementById('doctorEditId').value;
                const genderElement = document.querySelector('input[name="gender"]:checked');
                const gender = genderElement ? genderElement.value : 'Dr.';
                
                const rawName = document.getElementById('name').value.trim();
                const rawCrm = document.getElementById('crm').value.trim();

                if (!rawName || !rawCrm) {
                    this.showAlert('Atenção', 'Os campos Nome Completo e CRM são obrigatórios.');
                    return;
                }

                const name = rawName.toLowerCase().startsWith('dr') ? rawName : `${gender} ${rawName}`;
                const crm = rawCrm;

                const normNovoNome = this.normalizarTexto(rawName);
                const normNovoCrm = this.normalizarTexto(crm);

                const duplicado = this.doctors.find(doc => {
                    if (editId && String(doc.id) === String(editId)) return false;

                    const nomeBancoLimpo = doc.name ? doc.name.replace(/^Dr\.?\s*/i, '').replace(/^Dra\.?\s*/i, '') : '';
                    const normBancoNome = this.normalizarTexto(nomeBancoLimpo);
                    const normBancoCrm = this.normalizarTexto(doc.crm);

                    return normBancoNome === normNovoNome || normBancoCrm === normNovoCrm;
                });

                if (duplicado) {
                    const nomeBancoLimpo = duplicado.name ? duplicado.name.replace(/^Dr\.?\s*/i, '').replace(/^Dra\.?\s*/i, '') : '';
                    if (this.normalizarTexto(nomeBancoLimpo) === normNovoNome) {
                        this.showAlert('Médico Duplicado', `Já existe um médico cadastrado com o nome "${nomeBancoLimpo}".`);
                        return;
                    } else {
                        this.showAlert('CRM Duplicado', `O número de CRM "${duplicado.crm}" já pertence a outro médico cadastrado.`);
                        return;
                    }
                }

                const specialization = document.getElementById('specialization').value || " ";
                
                const subspecChecked = Array.from(document.querySelectorAll('input[name="subspecialties"]:checked'))
                    .map(el => el.value);
                const subspecialties = subspecChecked.length > 0 ? subspecChecked.join(', ') : " ";

                const hospital = document.getElementById('selectHospital').value || " ";
                const room = document.getElementById('room').value.trim() || " ";
                const phone = document.getElementById('phone').value.trim() || " ";
                const cellphone = document.getElementById('cellphone').value.trim() || " ";
                const personalPhone = document.getElementById('personalPhone').value.trim() || " ";
                const secretary = document.getElementById('secretary').value.trim() || " ";
                const notes = document.getElementById('notes').value.trim() || " ";
                
                const indicatesEl = document.querySelector('input[name="indicates"]:checked');
                const indicates = indicatesEl ? indicatesEl.value : " ";
                
                const present = document.getElementById('present').value || " ";
                const specialPresent = document.getElementById('specialPresent').value || " ";
                const responsible = document.getElementById('responsible').value || " ";
                const status = document.getElementById('status').value || " ";
                const nearbyUnit = document.getElementById('nearbyUnit').value || " ";
                const lastIndicationDate = document.getElementById('lastIndicationDate').value || " ";
                
                const rawVisitDate = document.getElementById('visitDate').value;
                let visitDate = " ";
                if (rawVisitDate) {
                    const p = rawVisitDate.split('-');
                    if (p.length === 3) visitDate = `${p[2]}/${p[1]}/${p[0]}`;
                }

                const dobDay = document.getElementById('dobDay').value;
                const dobMonth = document.getElementById('dobMonth').value;
                let birthdate = " ";
                if(dobDay && dobMonth) {
                    birthdate = `2024-${dobMonth}-${dobDay}`;
                }

                const horariosLista = [];
                document.querySelectorAll('#horariosContainer > div').forEach(div => {
                    const dia = div.querySelector('.horario-dia').value;
                    const periodo = div.querySelector('.horario-periodo').value;
                    horariosLista.push({ dia, periodo });
                });
                const schedules = horariosLista.length > 0 ? JSON.stringify(horariosLista) : " ";

                const finalId = editId ? Number(editId) : undefined;

                const obj = {
                    name, crm, specialization, subspecialties, hospital, room, phone, cellphone, personalPhone, secretary, notes, indicates,
                    present, specialPresent, responsible, status, nearbyUnit, visitDate, lastIndicationDate, birthdate, schedules
                };

                // Só adiciona o id no objeto se for uma edição
                if (finalId) {
                    obj.id = finalId;
                }

                if (supabaseClient) {
                    const { error } = await supabaseClient.from('doctors').upsert(obj);
                    if (error) {
                        console.error('Erro ao salvar no Supabase:', error);
                        this.showAlert('Erro', `Não foi possível salvar: ${error.message}`);
                        return;
                    }
                }

                window.location.href = 'index.html';
            }

            showAlert(titulo, texto) {
                document.getElementById('alertaTitulo').textContent = titulo;
                document.getElementById('alertaTexto').textContent = texto;
                document.getElementById('modalAlerta').classList.remove('hidden');
            }
            fecharAlerta() { document.getElementById('modalAlerta').classList.add('hidden'); }
        }
        const addApp = new AddApp();
    </script>
</body>
</html>
