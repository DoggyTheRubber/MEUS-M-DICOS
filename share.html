<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optica La Patrícia - Relatórios Compartilhados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f7f6; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen p-4">

    <div class="max-w-2xl mx-auto w-full space-y-4 flex-1 pb-10">
        <!-- Header -->
        <header class="bg-slate-900 text-white p-5 rounded-2xl shadow-md flex items-center justify-between">
            <div>
                <h1 class="font-bold text-lg tracking-tight">Optica La Patrícia</h1>
                <p class="text-xs text-slate-400">Relatórios Compartilhados (Visualização)</p>
            </div>
            <button onclick="compartilharPagina()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2.5 rounded-xl transition text-xs flex items-center gap-2 shadow">
                <i class="fa-solid fa-share-nodes"></i> Compartilhar
            </button>
        </header>

        <!-- Lista de Relatórios -->
        <div id="shared-reports-container" class="space-y-3"></div>
    </div>

    <!-- ==================== POPUP DE PREVIEW (PRIMEIRO ACESSO) ==================== -->
    <div id="modalPreview" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="bg-amber-600 text-white p-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-bell text-lg"></i>
                    <h3 class="font-bold text-base">Preview dos Relatórios de Hoje</h3>
                </div>
                <button onclick="fecharPreview()" class="text-amber-100 hover:text-white p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="preview-conteudo" class="p-5 overflow-y-auto space-y-2 text-xs text-slate-600">
                <!-- Preenchido via JS -->
            </div>
            <div class="bg-slate-50 border-t border-slate-100 p-4">
                <button onclick="fecharPreview()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-xs transition">
                    Ver Todos os Relatórios
                </button>
            </div>
        </div>
    </div>

    <script>
        function carregarRelatoriosCompartilhados() {
            const container = document.getElementById('shared-reports-container');
            const previewContainer = document.getElementById('preview-conteudo');
            
            const dadosRaw = localStorage.getItem('otica_shared_reports');
            if(!dadosRaw) {
                container.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 shadow-sm">
                        <p class="text-xs text-slate-500">Nenhum relatório compartilhado encontrado.</p>
                    </div>
                `;
                document.getElementById('modalPreview').classList.add('hidden');
                return;
            }

            const relatorios = JSON.parse(dadosRaw);
            if(relatorios.length === 0) {
                container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200 shadow-sm"><p class="text-xs text-slate-500">Lista vazia.</p></div>`;
                document.getElementById('modalPreview').classList.add('hidden');
                return;
            }

            let htmlLista = '';
            let htmlPreview = '<p class="font-semibold text-slate-900 mb-2">Relatórios importantes selecionados:</p>';

            relatorios.forEach(r => {
                let dataFmt = r.date;
                if(r.date && r.date.includes('-')) {
                    const p = r.date.split('-');
                    dataFmt = `${p[2]}/${p[1]}/${p[0]}`;
                }

                // Render na tela principal (Sem permissão de edição)
                htmlLista += `
                    <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs space-y-2">
                        <div class="flex items-center justify-between">
                            <h4 class="font-bold text-slate-900 text-sm">${r.title}</h4>
                            <span class="text-[11px] font-medium bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md"><i class="fa-solid fa-calendar mr-1"></i> ${dataFmt}</span>
                        </div>
                        <p class="text-xs text-amber-700 font-semibold flex items-center gap-1">
                            <i class="fa-solid fa-user-doctor"></i> ${r.doctorName} ${r.hospitalName ? '(' + r.hospitalName + ')' : ''}
                        </p>
                        <p class="text-xs text-slate-700 bg-slate-50 p-3 rounded-xl border border-slate-100 font-mono leading-relaxed">${r.content}</p>
                    </div>
                `;

                // Render no Popup de Preview
                htmlPreview += `
                    <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 space-y-1">
                        <span class="font-bold text-slate-900">${r.title} - ${r.doctorName}</span>
                        <p class="text-[11px] text-slate-600 line-clamp-2 font-mono">${r.content}</p>
                    </div>
                `;
            });

            container.innerHTML = htmlLista;
            previewContainer.innerHTML = htmlPreview;
        }

        function fecharPreview() {
            document.getElementById('modalPreview').classList.add('hidden');
        }

        async function compartilharPagina() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Relatórios - Optica La Patrícia',
                        text: 'Confira os relatórios de atendimento recentes da Optica La Patrícia.',
                        url: window.location.href,
                    });
                } catch (err) {
                    console.log('Compartilhamento cancelado ou falhou', err);
                }
            } else {
                // Fallback caso o navegador não suporte Web Share API
                navigator.clipboard.writeText(window.location.href);
                alert('Link copiado para a área de transferência!');
            }
        }

        window.onload = carregarRelatoriosCompartilhados;
    </script>
</body>
</html>
