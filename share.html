<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optica La Patrícia - Relatórios Compartilhados</title>
    <!-- Favicon personalizado -->
    <link rel="icon" type="image/png" href="la pipita.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
     <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase Client CDN -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f7f6; margin: 0; padding-bottom: 40px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Header idêntico ao Index -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-20 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl overflow-hidden bg-slate-800 flex items-center justify-center border border-slate-700 shadow shrink-0">
                <img src="la pipita.png" alt="La Pipita Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentNode.innerHTML='<i class=\'fa-solid fa-eye text-amber-500 text-lg\'></i>';">
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight">Relatórios Compartilhados</h1>
                <p class="text-xs text-slate-400">Ótica La Patrícia</p>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 max-w-2xl mx-auto w-full space-y-4">
        
        <!-- Barra de Ações Rápidas -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-2">
            <button onclick="compartilharPagina()" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition shadow-sm text-xs flex items-center justify-center gap-2">
                <i class="fa-solid fa-share-nodes"></i> Compartilhar Link
            </button>
            <button onclick="copiarLink()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition text-xs flex items-center justify-center gap-2">
                <i class="fa-solid fa-copy"></i> Copiar Link
            </button>
        </div>

        <!-- Lista de Relatórios -->
        <div class="space-y-3">
            <div class="text-xs font-bold text-slate-500 uppercase tracking-wider px-1" id="subtituloLista">Lista Completa de Relatórios</div>
            <div id="listaRelatorios" class="space-y-3">
                <div class="bg-white rounded-2xl p-8 text-center border border-slate-200 shadow-sm">
                    <p class="text-xs text-slate-500">Carregando relatórios do Supabase...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal / Popup Dinâmico (Abre caso haja IDs específicos na URL) -->
    <div id="modalPopupSelecao" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center gap-2">
                    <i class="fa-solid fa-file-lines text-amber-500"></i> Relatórios Selecionados
                </h3>
                <button onclick="fecharModalPopup()" class="text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto space-y-3 text-sm flex-1" id="conteudoPopupSelecao">
                <!-- Itens selecionados injetados via JS -->
            </div>
            <div class="bg-slate-50 border-t border-slate-100 p-4 flex justify-end">
                <button onclick="fecharModalPopup()" class="bg-slate-900 text-white text-xs font-semibold px-5 py-2.5 rounded-xl">
                    Ver Todos na Página
                </button>
            </div>
        </div>
    </div>

    <!-- Toast de Notificação -->
    <div id="toastMessage" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 translate-y-24 bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs font-medium transition-all duration-300 shadow-xl z-50">
        Link copiado com sucesso!
    </div>

    <script>
        const SUPABASE_URL = 'https://qhtwbbrapldxidlqikzf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodHdiYnJhcGxkeGlkbHFpa3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNDA1OTgsImV4cCI6MjEwMTgxNjU5OH0.nhHFnhPvSdhl9z38OX0V6wqDCYaF9-Y8T4PgEfFcw80';
        
        let supabaseClient = null;
        try {
            if (window.supabase) {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            }
        } catch(e) {
            console.warn("Supabase não inicializado:", e);
        }

        async function carregarRelatoriosShare() {
            const params = new URLSearchParams(window.location.search);
            const idsParam = params.get('ids'); // Ex: ?ids=123,456
            const container = document.getElementById('listaRelatorios');

            if (!supabaseClient) {
                container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200"><p class="text-xs text-slate-500">Erro: Conexão com o Supabase não configurada.</p></div>`;
                return;
            }

            try {
                // Busca todos os relatórios da tabela
                const { data: itens, error } = await supabaseClient.from('reports').select('*');

                if (error) throw error;

                if (!Array.isArray(itens) || itens.length === 0) {
                    container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200"><p class="text-xs text-slate-500">Nenhum relatório encontrado no Supabase.</p></div>`;
                    return;
                }

                // Renderiza a lista completa na página principal do share (sem edição permitida)
                let htmlCompleto = '';
                itens.forEach(item => {
                    htmlCompleto += `
                        <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-2xs space-y-1">
                            <div class="flex items-center justify-between">
                                <h4 class="font-bold text-slate-900 text-sm">${item.title}</h4>
                                <span class="text-[11px] bg-slate-100 text-slate-600 font-semibold px-2 py-0.5 rounded-md">${item.date || ''}</span>
                            </div>
                            <p class="text-xs text-slate-600 whitespace-pre-line">${item.content}</p>
                        </div>
                    `;
                });
                container.innerHTML = htmlCompleto;

                // Se houver IDs na URL, monta e exibe o popup com os itens selecionados
                if (idsParam) {
                    const idsArray = idsParam.split(',');
                    const itensSelecionados = itens.filter(i => idsArray.includes(String(i.id)));

                    if (itensSelecionados.length > 0) {
                        let htmlPopup = '';
                        itensSelecionados.forEach(item => {
                            htmlPopup += `
                                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1">
                                    <div class="flex items-center justify-between">
                                        <h5 class="font-bold text-slate-900 text-xs">${item.title}</h5>
                                        <span class="text-[10px] text-amber-700 font-semibold">${item.date || ''}</span>
                                    </div>
                                    <p class="text-xs text-slate-600 whitespace-pre-line">${item.content}</p>
                                </div>
                            `;
                        });
                        document.getElementById('conteudoPopupSelecao').innerHTML = htmlPopup;
                        document.getElementById('modalPopupSelecao').classList.remove('hidden');
                    }
                }

            } catch (e) {
                console.error(e);
                container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center border border-slate-200"><p class="text-xs text-slate-500">Erro ao buscar os relatórios no Supabase.</p></div>`;
            }
        }

        function fecharModalPopup() {
            document.getElementById('modalPopupSelecao').classList.add('hidden');
        }

        function copiarLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                mostrarToast("Link copiado para a área de transferência!");
            }).catch(err => {
                console.error('Erro ao copiar: ', err);
                mostrarToast("Não foi possível copiar o link.");
            });
        }

        async function compartilharPagina() {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Optica La Patrícia - Relatórios',
                        text: 'Confira os relatórios de atendimento.',
                        url: window.location.href,
                    });
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('Erro ao compartilhar:', err);
                    }
                }
            } else {
                copiarLink();
            }
        }

        function mostrarToast(mensagem) {
            const toast = document.getElementById('toastMessage');
            toast.textContent = mensagem;
            toast.classList.remove('translate-y-24');
            setTimeout(() => {
                toast.classList.add('translate-y-24');
            }, 3000);
        }

        window.onload = carregarRelatoriosShare;
    </script>
</body>
</html>
