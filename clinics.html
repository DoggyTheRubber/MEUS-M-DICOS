<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ótica La Patrícia - Gestão de Clínicas</title>
    <link rel="icon" type="image/png" href="la pipita.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="flex flex-col min-h-screen pb-20 transition-colors duration-200">

    <header class="app-header shadow-md sticky top-0 z-20 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="opacity-70 hover:opacity-100 mr-1"><i class="fa-solid fa-arrow-left text-base"></i></a>
            <div>
                <h1 class="font-bold text-base tracking-tight">Gestão de Clínicas</h1>
                <p class="text-xs opacity-70">Ótica La Patrícia</p>
            </div>
        </div>
        <a href="settings.html" class="opacity-70 hover:opacity-100 transition">
            <i class="fa-solid fa-gear text-xl"></i>
        </a>
    </header>

    <main class="flex-1 overflow-y-auto p-4 max-w-2xl mx-auto w-full space-y-4">
        <div class="app-card p-5 rounded-2xl shadow-sm border space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700">
                <h2 id="formTitle" class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-hospital text-amber-600 dark:text-amber-500"></i> Nova Clínica
                </h2>
                <span id="formBadge" class="text-xs bg-amber-100 dark:bg-amber-950 text-amber-800 dark:text-amber-300 font-medium px-2.5 py-1 rounded-full">Cadastro</span>
            </div>

            <form id="formClinica" onsubmit="clinicManager.salvar(event)" class="space-y-3 text-sm">
                <input type="hidden" id="editClinicaId">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Nome da Clínica *</label>
                    <input type="text" id="inputNome" required placeholder="Ex: Hospital Vision" class="w-full px-3.5 py-2.5 app-input border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Endereço da Clínica *</label>
                    <input type="text" id="inputEndereco" required placeholder="Ex: Av. Contorno, 4500 - Savassi" class="w-full px-3.5 py-2.5 app-input border rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div class="flex gap-2 pt-1">
                    <button type="submit" id="btnSalvar" class="flex-1 app-header font-semibold py-2.5 rounded-xl transition shadow-sm text-xs flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-floppy-disk text-amber-400"></i> Salvar Clínica
                    </button>
                    <button type="button" id="btnCancelar" onclick="clinicManager.cancelarEdicao()" class="hidden app-btn-secondary font-semibold px-4 py-2.5 rounded-xl transition text-xs">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>

        <div class="space-y-3">
            <div class="text-xs font-bold uppercase tracking-wider px-1 opacity-75">Clínicas Cadastradas</div>
            <div id="clinicsContainer" class="space-y-2 pb-6">
                <div class="app-card rounded-2xl p-6 text-center border shadow-sm"><p class="text-xs opacity-70">Carregando clínicas...</p></div>
            </div>
        </div>
    </main>

    <!-- Modal Alerta -->
    <div id="modalAlerta" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="app-card w-full max-w-sm rounded-2xl shadow-2xl p-6 text-center space-y-4 border">
            <h4 id="alertaTitulo" class="font-bold text-base">Aviso</h4>
            <p id="alertaTexto" class="text-xs opacity-80 leading-relaxed"></p>
            <button onclick="clinicManager.fecharAlerta()" class="w-full app-header font-semibold py-2.5 rounded-xl text-xs">Entendido</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const SUPABASE_URL = 'https://qhtwbbrapldxidlqikzf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodHdiYnJhcGxkeGlkbHFpa3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNDA1OTgsImV4cCI6MjEwMTgxNjU5OH0.nhHFnhPvSdhl9z38OX0V6wqDCYaF9-Y8T4PgEfFcw80';
        let supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        class ClinicManager {
            constructor() {
                this.clinics = [];
                this.doctors = [];
                this.init();
            }

            async init() {
                await this.carregarDados();
            }

            async carregarDados() {
                try {
                    if (!supabaseClient) return;
                    const [resClinicas, resMedicos] = await Promise.all([
                        supabaseClient.from('clinics').select('*'),
                        supabaseClient.from('doctors').select('*')
                    ]);

                    if (!resClinicas.error && resClinicas.data) {
                        this.clinics = resClinicas.data;
                    }
                    if (!resMedicos.error && resMedicos.data) {
                        this.doctors = resMedicos.data;
                    }
                    this.renderizarLista();
                } catch (err) {
                    console.error("Erro ao carregar dados:", err);
                    this.mostrarAlerta("Erro", "Não foi possível carregar os dados do servidor.");
                }
            }

            async salvar(event) {
                event.preventDefault();
                const idEdit = document.getElementById('editClinicaId').value;
                const nomeInput = document.getElementById('inputNome').value.trim();
                const enderecoInput = document.getElementById('inputEndereco').value.trim();

                if (!nomeInput || !enderecoInput) {
                    this.mostrarAlerta("Atenção", "Preencha todos os campos obrigatórios.");
                    return;
                }

                try {
                    if (idEdit) {
                        // --- FLUXO DE EDIÇÃO ---
                        const clinicaAntiga = this.clinics.find(c => String(c.id) === String(idEdit));
                        if (!clinicaAntiga) return;

                        const nomeAntigo = clinicaAntiga.name;

                        // 1. Atualiza a clínica no Supabase
                        const { error: errClinica } = await supabaseClient
                            .from('clinics')
                            .update({ name: nomeInput, address: enderecoInput })
                            .eq('id', idEdit);

                        if (errClinica) throw errClinica;

                        // 2. Se o nome mudou, atualiza cada médico individualmente no banco de dados
                        if (nomeAntigo !== nomeInput) {
                            const medicosAfetados = this.doctors.filter(d => 
                                d.hospital && d.hospital.trim().toLowerCase() === nomeAntigo.trim().toLowerCase()
                            );

                            for (let doc of medicosAfetados) {
                                await supabaseClient
                                    .from('doctors')
                                    .update({ hospital: nomeInput })
                                    .eq('id', doc.id);
                            }
                        }

                        this.mostrarAlerta("Sucesso", "Clínica atualizada com sucesso!");
                    } else {
                        // --- FLUXO DE CRIAÇÃO ---
                        const { error: errCriacao } = await supabaseClient
                            .from('clinics')
                            .insert([{ name: nomeInput, address: enderecoInput }]);

                        if (errCriacao) throw errCriacao;

                        this.mostrarAlerta("Sucesso", "Clínica cadastrada com sucesso!");
                    }

                    this.cancelarEdicao();
                    await this.carregarDados();

                } catch (err) {
                    console.error("Erro ao salvar clínica:", err);
                    this.mostrarAlerta("Erro", "Ocorreu um erro ao salvar os dados no banco.");
                }
            }

            prepararEdicao(id) {
                const cli = this.clinics.find(c => String(c.id) === String(id));
                if (!cli) return;

                document.getElementById('editClinicaId').value = cli.id;
                document.getElementById('inputNome').value = cli.name;
                document.getElementById('inputEndereco').value = cli.address;

                document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen text-amber-600 dark:text-amber-500"></i> Editar Clínica`;
                document.getElementById('formBadge').textContent = `Editando ID: ${cli.id}`;
                document.getElementById('btnCancelar').classList.remove('hidden');
                
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }

            cancelarEdicao() {
                document.getElementById('editClinicaId').value = '';
                document.getElementById('formClinica').reset();
                document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-hospital text-amber-600 dark:text-amber-500"></i> Nova Clínica`;
                document.getElementById('formBadge').textContent = `Cadastro`;
                document.getElementById('btnCancelar').classList.add('hidden');
            }

            async excluir(id) {
                const cli = this.clinics.find(c => String(c.id) === String(id));
                if (!cli) return;

                const totalVinculados = this.doctors.filter(d => 
                    d.hospital && d.hospital.trim().toLowerCase() === cli.name.trim().toLowerCase()
                ).length;

                if (totalVinculados > 0) {
                    this.mostrarAlerta("Ação Bloqueada", `Não é possível excluir esta clínica pois existem ${totalVinculados} médico(s) vinculados a ela.`);
                    return;
                }

                if (!confirm(`Deseja realmente excluir a clínica "${cli.name}"?`)) return;

                try {
                    const { error } = await supabaseClient.from('clinics').delete().eq('id', id);
                    if (error) throw error;

                    this.mostrarAlerta("Sucesso", "Clínica excluída com sucesso!");
                    await this.carregarDados();
                } catch (err) {
                    console.error("Erro ao excluir:", err);
                    this.mostrarAlerta("Erro", "Não foi possível excluir a clínica.");
                }
            }

            renderizarLista() {
                const container = document.getElementById('clinicsContainer');
                if (!container) return;

                if (this.clinics.length === 0) {
                    container.innerHTML = `<div class="app-card rounded-2xl p-6 text-center border shadow-sm"><p class="text-xs opacity-70">Nenhuma clínica cadastrada.</p></div>`;
                    return;
                }

                // Ordena alfabeticamente pelo nome
                const clinicasOrdenadas = [...this.clinics].sort((a, b) => 
                    (a.name || '').localeCompare(b.name || '', 'pt-BR', { sensitivity: 'accent' })
                );

                let html = '';
                clinicasOrdenadas.forEach(c => {
                    const totalMedicos = this.doctors.filter(d => 
                        d.hospital && d.hospital.trim().toLowerCase() === c.name.trim().toLowerCase()
                    ).length;

                    html += `
                        <div class="app-card p-4 rounded-2xl border shadow-2xs flex items-center justify-between">
                            <div class="space-y-0.5 pr-2">
                                <h4 class="font-bold text-sm"><i class="fa-solid fa-hospital text-amber-600 dark:text-amber-500"></i> ${c.name}</h4>
                                <p class="text-xs opacity-75">${c.address}</p>
                                <p class="text-[11px] text-amber-700 dark:text-amber-400 font-semibold">${totalMedicos} médico(s) vinculado(s)</p>
                            </div>
                            <div class="flex items-center gap-1">
                                <button onclick="clinicManager.prepararEdicao('${c.id}')" class="app-btn-secondary p-2 rounded-xl text-xs"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="clinicManager.excluir('${c.id}')" class="bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 text-rose-600 dark:text-rose-400 p-2 rounded-xl text-xs"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            mostrarAlerta(titulo, texto) {
                document.getElementById('alertaTitulo').textContent = titulo;
                document.getElementById('alertaTexto').textContent = texto;
                document.getElementById('modalAlerta').classList.remove('hidden');
            }

            fecharAlerta() {
                document.getElementById('modalAlerta').classList.add('hidden');
            }
        }

        const clinicManager = new ClinicManager();
    </script>
</body>
</html>
