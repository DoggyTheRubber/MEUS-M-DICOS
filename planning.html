<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ótica La Patrícia - Planejamento</title>
    <link rel="icon" type="image/png" href="la pipita.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script>
        // Aplica o tema salvo antes de carregar para evitar piscar a tela
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="flex flex-col min-h-screen pb-20 transition-colors duration-200">

    <header class="app-header shadow-md sticky top-0 z-20 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="opacity-70 hover:opacity-100 mr-1"><i class="fa-solid fa-arrow-left text-base"></i></a>
            <div>
                <h1 class="font-bold text-base tracking-tight">Planejamento Diário</h1>
                <p class="text-xs opacity-70">Ótica La Patrícia</p>
            </div>
        </div>
        <a href="settings.html" class="opacity-70 hover:opacity-100 transition">
            <i class="fa-solid fa-gear text-xl"></i>
        </a>
    </header>

    <main class="flex-1 overflow-y-auto p-4 max-w-2xl mx-auto w-full space-y-4">
        <div class="app-card p-5 rounded-2xl shadow-sm border space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700">
                <h2 class="font-bold text-lg flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-amber-600 dark:text-amber-500"></i> Novo Planejamento
                </h2>
            </div>

            <form id="formPlanejamento" onsubmit="planApp.adicionarPlanejamento(event)" class="space-y-3 text-sm">
                <!-- Campo de Médico com Autocomplete -->
                <div class="relative">
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Selecione o Médico *</label>
                    <div class="relative">
                        <input type="text" id="planDoctorSearch" placeholder="Digite para buscar o médico..." autocomplete="off" oninput="planApp.filtrarMedicos(this.value)" onfocus="planApp.abrirDropdownMedicos()" required class="w-full px-3.5 py-2.5 app-input border rounded-xl pr-10">
                        <span class="absolute right-3 top-1/2 -translate-y-1/2 opacity-50 pointer-events-none">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                    </div>
                    <!-- Dropdown de Sugestões -->
                    <div id="doctorDropdownList" class="absolute left-0 right-0 mt-1 app-card border rounded-xl shadow-lg max-h-48 overflow-y-auto z-30 hidden"></div>
                    <!-- Campos ocultos para guardar a seleção real -->
                    <input type="hidden" id="planDoctorId">
                    <input type="text" id="planDoctorCustom" placeholder="Digite o nome do médico..." class="w-full px-3.5 py-2.5 app-input border rounded-xl mt-2 hidden">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Data do Planejamento *</label>
                    <input type="date" id="planDate" required class="w-full px-3.5 py-2.5 app-input border rounded-xl">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider mb-1 opacity-80">Texto da Tarefa *</label>
                    <select id="planSelectOption" onchange="planApp.tratarMudancaOpcao(this.value)" required class="w-full px-3.5 py-2.5 app-input border rounded-xl mb-2">
                        <option value="">Selecione a tarefa...</option>
                        <option value="Entregar cartões de visita">Entregar cartões de visita</option>
                        <option value="Entregar presente">Entregar presente</option>
                        <option value="Entregar revistinhas">Entregar revistinhas</option>
                        <option value="Entregar vinho">Entregar vinho</option>
                        <option value="Óculos verificação">Óculos verificação</option>
                        <option value="Visita de apresentação">Visita de apresentação</option>
                        <option value="Visita de rotina">Visita de rotina</option>
                        <option value="Outros">Outro</option>
                    </select>
                    <input type="text" id="planTextCustom" placeholder="Especifique a tarefa..." class="w-full px-3.5 py-2.5 app-input border rounded-xl hidden">
                </div>
                <button type="submit" class="w-full app-header font-semibold py-3 rounded-xl transition shadow-sm text-xs flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-plus text-amber-400"></i> Adicionar Planejamento
                </button>
            </form>
        </div>

        <div class="space-y-3">
            <div class="text-xs font-bold uppercase tracking-wider px-1 opacity-75">Itens por Dia</div>
            <div id="planning-list-container" class="space-y-4 pb-6"></div>
        </div>
    </main>

    <!-- Modal de Confirmação de Exclusão -->
    <div id="modalConfirmarExclusao" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="app-card w-full max-w-sm rounded-2xl shadow-2xl overflow-hidden flex flex-col border p-5 space-y-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-rose-100 dark:bg-rose-950 text-rose-600 dark:text-rose-300 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-triangle-exclamation text-lg"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm">Excluir Planejamento</h3>
                    <p class="text-xs opacity-70">Deseja realmente apagar este item?</p>
                </div>
            </div>
            <div class="flex items-center gap-2 justify-end pt-2">
                <button type="button" onclick="planApp.fecharModalExclusao()" class="app-btn-secondary text-xs font-semibold px-4 py-2.5 rounded-xl">Cancelar</button>
                <button type="button" id="btnConfirmarExclusao" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-md transition">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

    <script>
        const SUPABASE_URL = 'https://qhtwbbrapldxidlqikzf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFodHdiYnJhcGxkeGlkbHFpa3pmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyNDA1OTgsImV4cCI6MjEwMTgxNjU5OH0.nhHFnhPvSdhl9z38OX0V6wqDCYaF9-Y8T4PgEfFcw80';
        let supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        class PlanningApp {
            constructor() {
                this.doctors = [];
                this.planning = [];
                this.reports = [];
                this.itemParaExcluirId = null;
                this.initDateInput();
                this.loadData();
                this.initGlobalClickListeners();
            }

            initGlobalClickListeners() {
                // Fecha o dropdown se clicar fora dele
                document.addEventListener('click', (e) => {
                    const container = document.getElementById('planDoctorSearch');
                    const dropdown = document.getElementById('doctorDropdownList');
                    if (container && dropdown && !container.contains(e.target) && !dropdown.contains(e.target)) {
                        dropdown.classList.add('hidden');
                    }
                });
            }

            initDateInput() {
                const hojeIso = new Date().toISOString().split('T')[0];
                const inputDate = document.getElementById('planDate');
                if (inputDate) inputDate.value = hojeIso;
            }

            converterIsoParaPtBr(dataIso) {
                if (!dataIso) return '';
                if (dataIso.includes('/')) return dataIso;
                const [ano, mes, dia] = dataIso.split('-');
                return `${dia}/${mes}/${ano}`;
            }

            formatarDataExtenso(dataStr) {
                const [dia, mes, ano] = dataStr.split('/');
                const dataObj = new Date(`${ano}-${mes}-${dia}T00:00:00`);
                const diasDaSemana = ['Domingo', 'Segunda-Feira', 'Terça-Feira', 'Quarta-Feira', 'Quinta-Feira', 'Sexta-Feira', 'Sábado'];
                const meses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
                
                const nomeDia = diasDaSemana[dataObj.getDay()] || '';
                const diaMes = dataObj.getDate();
                const nomeMes = meses[dataObj.getMonth()] || '';
                
                return `${nomeDia}, ${diaMes} de ${nomeMes}`;
            }

            tratarMudancaOpcao(valor) {
                const campoCustom = document.getElementById('planTextCustom');
                if (!campoCustom) return;
                if (valor === 'Outros') {
                    campoCustom.classList.remove('hidden');
                    campoCustom.required = true;
                } else {
                    campoCustom.classList.add('hidden');
                    campoCustom.required = false;
                    campoCustom.value = '';
                }
            }

            async loadData() {
                try {
                    if (supabaseClient) {
                        const [resDoc, resPlan, resRep] = await Promise.all([
                            supabaseClient.from('doctors').select('*'),
                            supabaseClient.from('planning').select('*'),
                            supabaseClient.from('reports').select('*')
                        ]);
                        if (!resDoc.error && resDoc.data) this.doctors = resDoc.data;
                        if (!resRep.error && resRep.data) this.reports = resRep.data;
                        
                        if (!resPlan.error && resPlan.data) {
                            const hoje = new Date();
                            hoje.setHours(0, 0, 0, 0);
                            let itensValidos = [];

                            for (let item of resPlan.data) {
                                const dataItemStr = item.dayGroup || "";
                                const [d, m, a] = dataItemStr.split('/');
                                const dataItemObj = new Date(`${a}-${m}-${d}T00:00:00`);

                                if (item.checked && dataItemStr && dataItemObj < hoje) {
                                    await supabaseClient.from('planning').delete().eq('id', item.id);
                                } else {
                                    itensValidos.push(item);
                                }
                            }
                            this.planning = itensValidos;
                        }
                    }
                    this.renderPlanningList();
                } catch(e) { console.error(e); }
            }

            getMedicosOrdenados() {
                const extrairNomeLimpo = (nomeCompleto) => {
                    if (!nomeCompleto) return '';
                    let limpo = nomeCompleto.trim();
                    if (/^dr\.?/i.test(limpo)) {
                        limpo = limpo.replace(/^dr\.?\s*/i, '');
                    } else if (/^dra\.?/i.test(limpo)) {
                        limpo = limpo.replace(/^dra\.?\s*/i, '');
                    }
                    return limpo.trim();
                };

                return [...this.doctors].sort((a, b) => {
                    const nomeA = extrairNomeLimpo(a.name);
                    const nomeB = extrairNomeLimpo(b.name);
                    return nomeA.localeCompare(nomeB, 'pt-BR', { sensitivity: 'accent' });
                });
            }

            abrirDropdownMedicos() {
                const input = document.getElementById('planDoctorSearch');
                this.filtrarMedicos(input.value);
            }

            filtrarMedicos(termo) {
                const dropdown = document.getElementById('doctorDropdownList');
                if (!dropdown) return;

                const termoLower = termo.toLowerCase().trim();
                const medicos = this.getMedicosOrdenados();

                // Filtra os médicos com base no texto digitado
                const filtrados = medicos.filter(d => {
                    const nome = (d.name || '').toLowerCase();
                    const hospital = (d.hospital || '').toLowerCase();
                    return nome.includes(termoLower) || hospital.includes(termoLower);
                });

                let html = '';

                // Renderiza os médicos encontrados em ordem alfabética
                filtrados.forEach(d => {
                    html += `
                        <div onclick="planApp.selecionarMedico('${d.id}', '${d.name.replace(/'/g, "\\'")}', '${(d.hospital || 'Sem clínica').replace(/'/g, "\\'")}')" 
                             class="px-3.5 py-2.5 hover:bg-amber-50 dark:hover:bg-amber-950/40 cursor-pointer text-xs border-b border-slate-100 dark:border-slate-800 transition">
                            <span class="font-semibold">${d.name}</span> <span class="opacity-60">(${d.hospital || 'Sem clínica'})</span>
                        </div>
                    `;
                });

                // Sempre adiciona a opção "Outro" no final da lista
                html += `
                    <div onclick="planApp.selecionarOutroMedico()" 
                         class="px-3.5 py-2.5 hover:bg-amber-50 dark:hover:bg-amber-950/40 cursor-pointer text-xs font-bold text-amber-600 dark:text-amber-400 transition">
                        <i class="fa-solid fa-plus mr-1"></i> Outro
                    </div>
                `;

                dropdown.innerHTML = html;
                dropdown.classList.remove('hidden');

                // Se o usuário limpou o campo de busca, limpa os IDs ocultos relacionados
                if (!termoLower) {
                    document.getElementById('planDoctorId').value = '';
                }
            }

            selecionarMedico(id, nome, hospital) {
                document.getElementById('planDoctorSearch').value = `${nome} (${hospital})`;
                document.getElementById('planDoctorId').value = id;
                
                // Esconde campo customizado se estivesse visível
                const campoCustom = document.getElementById('planDoctorCustom');
                campoCustom.classList.add('hidden');
                campoCustom.required = false;
                campoCustom.value = '';

                document.getElementById('doctorDropdownList').classList.add('hidden');
            }

            selecionarOutroMedico() {
                document.getElementById('planDoctorSearch').value = 'Outro';
                document.getElementById('planDoctorId').value = 'Outro';

                const campoCustom = document.getElementById('planDoctorCustom');
                campoCustom.classList.remove('hidden');
                campoCustom.required = true;
                campoCustom.value = '';
                campoCustom.focus();

                document.getElementById('doctorDropdownList').classList.add('hidden');
            }

            async adicionarPlanejamento(e) {
                e.preventDefault();
                const tipoMedicoSelecao = document.getElementById('planDoctorId').value;
                const searchInputVal = document.getElementById('planDoctorSearch').value.trim();
                const dataInput = document.getElementById('planDate').value;
                const selectOpcao = document.getElementById('planSelectOption').value;
                
                let doctorIdFinal = '';

                if (tipoMedicoSelecao === 'Outro' || searchInputVal === 'Outro') {
                    const nomeCustom = document.getElementById('planDoctorCustom').value.trim();
                    if (!nomeCustom) return;
                    doctorIdFinal = `custom:${nomeCustom}`;
                } else if (tipoMedicoSelecao) {
                    doctorIdFinal = tipoMedicoSelecao;
                } else {
                    // Caso o usuário digite um nome diretamente sem clicar nas opções da lista, assume como custom
                    if (!searchInputVal) return;
                    doctorIdFinal = `custom:${searchInputVal}`;
                }

                let text = selectOpcao;
                if (selectOpcao === 'Outros') {
                    text = document.getElementById('planTextCustom').value.trim();
                }

                if(!doctorIdFinal || !text || !dataInput) return;

                const dataFormatada = this.converterIsoParaPtBr(dataInput);

                const novoItem = {
                    id: Date.now(),
                    doctor_id: String(doctorIdFinal),
                    text: text,
                    dayGroup: dataFormatada,
                    checked: false
                };

                this.planning.unshift(novoItem);
                if (supabaseClient) {
                    const { error } = await supabaseClient.from('planning').insert([novoItem]);
                    if (error) {
                        console.error("Erro ao salvar planejamento:", error);
                        alert("Erro ao salvar no banco de dados. Verifique o console.");
                        return;
                    }
                }

                // Reseta o formulário
                document.getElementById('formPlanejamento').reset();
                document.getElementById('planDoctorId').value = '';
                document.getElementById('planDoctorSearch').value = '';
                document.getElementById('planDoctorCustom').classList.add('hidden');
                document.getElementById('planTextCustom').classList.add('hidden');
                this.initDateInput();
                this.renderPlanningList();
            }

            async togglePlanningItem(id) {
                const item = this.planning.find(p => String(p.id) === String(id));
                if(!item || item.checked) return;

                item.checked = true;
                if (supabaseClient) {
                    const { error } = await supabaseClient.from('planning').upsert([item]);
                    if (error) console.error("Erro ao atualizar planejamento:", error);
                }

                let nomeMedicoRelatorio = 'Médico';
                let realDoctorId = null;

                if (item.doctor_id && item.doctor_id.startsWith('custom:')) {
                    nomeMedicoRelatorio = item.doctor_id.replace('custom:', '');
                } else {
                    realDoctorId = item.doctor_id;
                    const doc = this.doctors.find(d => String(d.id) === String(realDoctorId));
                    if (doc) nomeMedicoRelatorio = doc.name;
                }

                const novoRelatorio = {
                    id: Date.now(),
                    title: `Relatório #${String(Date.now()).slice(-4)}`,
                    date: new Date().toISOString().split('T')[0],
                    doctor_id: realDoctorId,
                    content: `Planejamento concluído para ${nomeMedicoRelatorio}: "${item.text}".`,
                    isPending: true
                };

                this.reports.unshift(novoRelatorio);
                if (supabaseClient) {
                    const { error } = await supabaseClient.from('reports').upsert([novoRelatorio]);
                    if (error) console.error("Erro ao gerar relatório automático:", error);
                }
                this.renderPlanningList();
            }

            pedirConfirmacaoExclusao(id) {
                this.itemParaExcluirId = id;
                const modal = document.getElementById('modalConfirmarExclusao');
                const btnConfirmar = document.getElementById('btnConfirmarExclusao');
                if (modal && btnConfirmar) {
                    btnConfirmar.onclick = () => this.executarExclusaoItem();
                    modal.classList.remove('hidden');
                }
            }

            fecharModalExclusao() {
                this.itemParaExcluirId = null;
                const modal = document.getElementById('modalConfirmarExclusao');
                if (modal) modal.classList.add('hidden');
            }

            async executarExclusaoItem() {
                if (!this.itemParaExcluirId) return;
                const id = this.itemParaExcluirId;

                this.planning = this.planning.filter(p => String(p.id) !== String(id));
                if (supabaseClient) {
                    const { error } = await supabaseClient.from('planning').delete().eq('id', id);
                    if (error) console.error("Erro ao excluir planejamento:", error);
                }

                this.fecharModalExclusao();
                this.renderPlanningList();
            }

            renderPlanningList() {
                const container = document.getElementById('planning-list-container');
                if(!container) return;

                if(this.planning.length === 0) {
                    container.innerHTML = `<div class="app-card rounded-2xl p-8 text-center border"><p class="text-xs opacity-70">Nenhum planejamento cadastrado.</p></div>`;
                    return;
                }

                const grupos = {};
                this.planning.forEach(item => {
                    const dia = item.dayGroup || 'Outros';
                    if (!grupos[dia]) grupos[dia] = [];
                    grupos[dia].push(item);
                });

                const chavesOrdenadas = Object.keys(grupos).sort((a, b) => {
                    const [da, ma, aa] = a.split('/');
                    const [db, mb, ab] = b.split('/');
                    return new Date(`${aa}-${ma}-${da}`) - new Date(`${ab}-${mb}-${db}`);
                });

                let html = '';
                chavesOrdenadas.forEach(diaStr => {
                    const tituloDia = this.formatarDataExtenso(diaStr);

                    const itensDoDia = grupos[diaStr].sort((a, b) => {
                        const textoA = a.text || '';
                        const textoB = b.text || '';
                        
                        if (textoA === 'Outros' && textoB !== 'Outros') return 1;
                        if (textoB === 'Outros' && textoA !== 'Outros') return -1;
                        
                        return textoA.localeCompare(textoB, 'pt-BR', { sensitivity: 'accent' });
                    });

                    html += `
                        <div class="space-y-2">
                            <div class="text-xs font-bold text-amber-700 dark:text-amber-400 uppercase tracking-wider px-1 pt-2"><i class="fa-regular fa-calendar mr-1"></i> ${tituloDia}</div>
                            <div class="space-y-2">
                    `;

                    itensDoDia.forEach(item => {
                        let nomeExibicao = 'Médico';

                        if (item.doctor_id && item.doctor_id.startsWith('custom:')) {
                            nomeExibicao = item.doctor_id.replace('custom:', '');
                        } else {
                            const doc = this.doctors.find(d => String(d.id) === String(item.doctor_id));
                            if (doc) nomeExibicao = doc.name;
                        }

                        html += `
                            <div class="flex items-center justify-between p-3 rounded-xl border app-card shadow-sm">
                                <div class="flex items-center gap-3 pr-2 overflow-hidden">
                                    <input type="checkbox" ${item.checked ? 'checked disabled' : ''} onchange="planApp.togglePlanningItem('${item.id}')" class="w-4 h-4 text-amber-600 rounded shrink-0">
                                    <span class="text-xs font-semibold truncate ${item.checked ? 'line-through opacity-50' : ''}">${nomeExibicao} - ${item.text}</span>
                                </div>
                                <button type="button" onclick="planApp.pedirConfirmacaoExclusao('${item.id}')" class="opacity-60 hover:opacity-100 hover:text-rose-600 transition p-1.5 shrink-0" title="Excluir item">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        `;
                    });

                    html += `
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            }
        }
        const planApp = new PlanningApp();
    </script>
</body>
</html>
