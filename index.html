
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestão de Visitas Ótica</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f4f7f6; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding-bottom: 70px; }
        .header { background: var(--primary); color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 10; }
        .content { padding: 15px; }
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
        .homebar { position: fixed; bottom: 0; width: 100%; height: 60px; background: white; display: flex; border-top: 1px solid #ddd; }
        .nav-btn { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--primary); }
        .nav-btn.active { color: var(--accent); }
        .search-box { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        .hidden { display: none; }
        .error { color: red; font-size: 0.8em; }
    </style>
</head>
<body>

<div id="view-list">
    <div class="header">Lista de Médicos</div>
    <div class="content">
        <input type="text" id="search" class="search-box" placeholder="Buscar médico ou hospital..." oninput="renderList()">
        <button onclick="setFilter('all')">Todos</button>
        <button onclick="setFilter('yes')">Já Indica</button>
        <button onclick="setFilter('no')">Não Indica</button>
        <div id="doctor-list"></div>
    </div>
</div>

<div id="view-add" class="hidden">
    <div class="header">Novo Médico</div>
    <div class="content">
        <input type="text" id="name" placeholder="Nome Completo" oninput="validateName()">
        <div id="name-error" class="error"></div>
        <div>Gênero: <input type="radio" name="gender" value="M" checked> Homem <input type="radio" name="gender" value="F"> Mulher</div>
        <input type="date" id="dob">
        <input type="text" id="hospital" placeholder="Consultório/Hospital">
        <label><input type="checkbox" id="indicates"> Já indica?</label>
        <select id="present">
            <option value="Bombom">Bombom</option>
            <option value="Vinho">Vinho</option>
        </select>
        <textarea id="notes" placeholder="Descrição opcional"></textarea>
        <button onclick="saveDoctor()" style="width:100%; padding:15px; background:var(--accent); color:white; border:none; border-radius:5px;">Salvar Médico</button>
    </div>
</div>

<div class="homebar">
    <div class="nav-btn active" onclick="showView('list')">LISTA</div>
    <div class="nav-btn" onclick="showView('add')">CRIAR</div>
</div>

<script>
    let doctors = JSON.parse(localStorage.getItem('doctors') || '[]');
    let currentFilter = 'all';

    function showView(view) {
        document.getElementById('view-list').classList.toggle('hidden', view !== 'list');
        document.getElementById('view-add').classList.toggle('hidden', view !== 'add');
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.innerText === (view === 'list' ? 'LISTA' : 'CRIAR')));
    }

    function validateName() {
        const name = document.getElementById('name').value.trim().toLowerCase();
        const exists = doctors.find(d => d.name.toLowerCase() === name);
        document.getElementById('name-error').innerText = exists ? `Médico já cadastrado em: ${exists.hospital}` : '';
    }

    function saveDoctor() {
        const name = document.getElementById('name').value.trim();
        if(!name) return alert('Nome obrigatório');
        const gender = document.querySelector('input[name="gender"]:checked').value;
        const fullName = (gender === 'M' ? 'Dr. ' : 'Dra. ') + name;
        
        const doctor = {
            name: fullName,
            dob: document.getElementById('dob').value,
            hospital: document.getElementById('hospital').value,
            indicates: document.getElementById('indicates').checked,
            present: document.getElementById('present').value,
            notes: document.getElementById('notes').value
        };
        doctors.push(doctor);
        localStorage.setItem('doctors', JSON.stringify(doctors));
        alert('Salvo!');
        showView('list');
        renderList();
    }

    function renderList() {
        const q = document.getElementById('search').value.toLowerCase();
        const list = document.getElementById('doctor-list');
        list.innerHTML = '';
        doctors.filter(d => (currentFilter === 'all' || (currentFilter === 'yes' ? d.indicates : !d.indicates)) && (d.name.toLowerCase().includes(q) || d.hospital.toLowerCase().includes(q))).forEach(d => {
            list.innerHTML += `<div class="card" onclick="alert('${d.hospital} - Presente: ${d.present}')"><strong>${d.name}</strong><br>${d.indicates ? '✅ Indica' : '❌ Não indica'}</div>`;
        });
    }

    function setFilter(f) { currentFilter = f; renderList(); }
    renderList();
</script>
</body>
</html>
