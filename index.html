<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ótica La Patrícia - Início</title>
    <link rel="icon" type="image/png" href="la pipita.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="colors.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        // Aplica o tema salvo antes de carregar para evitar piscar a tela
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</head>
<body class="min-h-screen flex flex-col transition-colors duration-200">

    <!-- Cabeçalho Simples -->
    <header class="app-header shadow-md sticky top-0 z-20 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl overflow-hidden bg-slate-800 flex items-center justify-center border border-slate-700 shadow shrink-0">
                <img src="la pipita.png" alt="Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentNode.innerHTML='<i class=\'fa-solid fa-eye text-amber-500 text-lg\'></i>';">
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight">Painel Principal</h1>
                <p class="text-xs opacity-70">Ótica La Patrícia</p>
            </div>
        </div>
        <a href="settings.html" class="opacity-70 hover:opacity-100 transition">
            <i class="fa-solid fa-gear text-xl"></i>
        </a>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 max-w-2xl mx-auto w-full p-4 flex flex-col justify-center my-auto space-y-4">
        <div class="text-center mb-2">
            <h1 class="text-lg font-bold">Ótica La Patrícia</h1>
        </div>

        <!-- Grade de Opções -->
        <div class="grid grid-cols-2 gap-3">
            <a href="list.html" class="app-card p-4 rounded-2xl border shadow-sm hover:border-amber-400 flex flex-col items-center text-center transition group">
                <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition">
                    <i class="fa-solid fa-address-book"></i>
                </div>
                <span class="text-xs font-bold">Lista de Médicos</span>
                <span class="text-[10px] opacity-70 mt-0.5">Ver médicos e clínicas</span>
            </a>

            <a href="clinics.html" class="app-card p-4 rounded-2xl border shadow-sm hover:border-amber-400 flex flex-col items-center text-center transition group">
                <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition">
                    <i class="fa-solid fa-hospital"></i>
                </div>
                <span class="text-xs font-bold">Clínicas</span>
                <span class="text-[10px] opacity-70 mt-0.5">Gerenciar locais</span>
            </a>

            <a href="add.html" class="app-card p-4 rounded-2xl border shadow-sm hover:border-amber-400 flex flex-col items-center text-center transition group">
                <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <span class="text-xs font-bold">Novo Médico</span>
                <span class="text-[10px] opacity-70 mt-0.5">Cadastrar registro</span>
            </a>

            <a href="planning.html" class="app-card p-4 rounded-2xl border shadow-sm hover:border-amber-400 flex flex-col items-center text-center transition group">
                <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition">
                    <i class="fa-solid fa-calendar-days"></i>
                </div>
                <span class="text-xs font-bold">Planejamento</span>
                <span class="text-[10px] opacity-70 mt-0.5">Agenda e rotas</span>
            </a>

            <a href="reports.html" class="app-card p-4 rounded-2xl border shadow-sm hover:border-amber-400 flex flex-col items-center text-center transition group">
                <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition">
                    <i class="fa-solid fa-file-lines"></i>
                </div>
                <span class="text-xs font-bold">Relatórios</span>
                <span class="text-[10px] opacity-70 mt-0.5">Desempenho e indicações</span>
            </a>

            <a href="birthday.html" class="app-card p-4 rounded-2xl border shadow-sm hover:border-amber-400 flex flex-col items-center text-center transition group">
                <div class="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition">
                    <i class="fa-solid fa-cake-candles"></i>
                </div>
                <span class="text-xs font-bold">Aniversários</span>
                <span class="text-[10px] opacity-70 mt-0.5">Próximos da semana</span>
            </a>

            <a href="settings.html" class="app-card p-4 rounded-2xl border shadow-sm hover:border-amber-400 flex flex-col items-center text-center transition group col-span-2">
                <div class="w-12 h-12 rounded-xl app-btn-secondary flex items-center justify-center text-xl mb-2 group-hover:scale-110 transition">
                    <i class="fa-solid fa-gear"></i>
                </div>
                <span class="text-xs font-bold">Configurações</span>
                <span class="text-[10px] opacity-70 mt-0.5">Ajustes do sistema</span>
            </a>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
