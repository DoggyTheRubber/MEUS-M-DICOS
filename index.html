<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Optica La Patrícia - Gestão de Atendimentos</title>
    <link rel="icon" type="image/png" href="la pipita.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f4f7f6; margin: 0; padding-bottom: 80px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-20 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl overflow-hidden bg-slate-800 flex items-center justify-center border border-slate-700 shadow shrink-0">
                <img src="la pipita.png" alt="La Pipita Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentNode.innerHTML='<i class=\'fa-solid fa-eye text-amber-500 text-lg\'></i>';">
            </div>
            <div>
                <h1 class="font-bold text-base tracking-tight">Optica La Patrícia</h1>
                <p class="text-xs text-slate-400">Gestão de Atendimentos</p>
            </div>
        </div>
        <button onclick="app.migrarParaSistema()" class="text-xs text-amber-300 font-medium bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition flex items-center gap-1.5">
            <i class="fa-solid fa-cloud-arrow-up"></i> Migrar para Sistema
        </button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 max-w-2xl mx-auto w-full">
        
        <!-- TELA 1: LISTA DE MÉDICOS -->
        <section id="view-list" class="space-y-4">
            <div class="space-y-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="search" oninput="app.renderList()" placeholder="Buscar por CRM, nome, clínica ou especialidade..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
                </div>
                <div id="filter-container" class="hidden items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
                    <button onclick="app.setFilter('all')" id="filter-all" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-900 text-white transition whitespace-nowrap">Todos</button>
                    <button onclick="app.setFilter('sim')" id="filter-yes" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-white border border-slate-200 text-slate-600 transition whitespace-nowrap">Indica</button>
                    <button onclick="app.setFilter('nao')" id="filter-no" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-white border border-slate-200 text-slate-600 transition whitespace-nowrap">Não Indica</button>
                    <button onclick="app.setFilter('deixou')" id="filter-deixou" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-white border border-slate-200 text-slate-600 transition whitespace-nowrap">Deixou de indicar</button>
                </div>
            </div>

            <div id="clinica-breadcrumb" class="hidden items-center justify-between bg-amber-50 border border-amber-200 px-4 py-2.5 rounded-xl">
                <div class="flex items-center gap-2">
                    <button onclick="app.voltarParaClinicas()" class="bg-white text-amber-800 hover:bg-amber-100 p-1.5 rounded-lg border border-amber-200 text-xs font-bold transition flex items-center gap-1">
                        <i class="fa-solid fa-arrow-left"></i> Voltar às Clínicas
                    </button>
                    <span id="breadcrumb-titulo" class="font-bold text-slate-900 text-xs truncate max-w-[200px]">Clínica</span>
                </div>
                <span id="breadcrumb-contador" class="text-xs bg-amber-200 text-amber-900 font-semibold px-2 py-0.5 rounded-md">0 médicos</span>
            </div>

            <div id="doctor-list" class="space-y-3 pb-6"></div>
        </section>

        <!-- TELA DE GESTÃO DE CLÍNICAS -->
        <section id="view-clinics" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <h2 class="font-bold text-slate-900 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-hospital text-amber-600"></i> Gerenciar Clínicas
                    </h2>
                </div>

                <form id="formClinica" onsubmit="app.salvarClinica(event)" class="space-y-3 text-sm">
                    <input type="hidden" id="clinicaEditId">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Nome da Clínica *</label>
                        <input type="text" id="inputNomeClinica" required placeholder="Ex: Hospital Vision" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Endereço da Clínica *</label>
                        <input type="text" id="inputEnderecoClinica" required placeholder="Ex: Av. Contorno, 4500" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button type="submit" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-2.5 rounded-xl transition text-xs flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-floppy-disk text-amber-400"></i> Salvar Clínica
                        </button>
                        <button type="button" id="btnCancelarEdicaoClinica" onclick="app.cancelarEdicaoClinica()" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-4 py-2.5 rounded-xl transition text-xs">
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
            <div id="clinics-list-container" class="space-y-2 pb-6"></div>
        </section>

        <!-- TELA 2: NOVO / EDITAR MÉDICO -->
        <section id="view-add" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
                    <h2 id="form-doctor-title" class="font-bold text-slate-900 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-user-doctor text-amber-600"></i> Cadastrar Novo Médico
                    </h2>
                </div>

                <form id="formNovoMedico" onsubmit="app.saveDoctor(event)" class="space-y-4 text-sm">
                    <input type="hidden" id="doctorEditId">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Gênero *</label>
                        <div class="flex items-center gap-4 bg-slate-50 p-2.5 border border-slate-200 rounded-xl">
                            <label class="flex items-center gap-2 cursor-pointer font-medium"><input type="radio" name="gender" value="Dr." checked class="text-amber-600"> Homem (Dr.)</label>
                            <label class="flex items-center gap-2 cursor-pointer font-medium"><input type="radio" name="gender" value="Dra." class="text-amber-600"> Mulher (Dra.)</label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Nome Completo *</label>
                        <input type="text" id="name" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">CRM *</label>
                        <input type="text" id="crm" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Especialização *</label>
                        <select id="specialization" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                            <option value="Oftalmo Geral">Oftalmo Geral</option>
                            <option value="Oftalmo Pediatria">Oftalmo Pediatria</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Subespecializações</label>
                        <div id="subspec-tags" class="flex flex-wrap gap-2 p-3 bg-slate-50 border border-slate-200 rounded-xl"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Clínica Vinculada *</label>
                        <select id="selectHospital" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Observações</label>
                        <textarea id="notes" rows="3" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></textarea>
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button type="submit" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl transition text-xs flex items-center justify-center gap-2">
                            <i class="fa-solid fa-floppy-disk text-amber-400"></i> Salvar Médico
                        </button>
                        <button type="button" id="btnCancelarEdicaoMedico" onclick="app.cancelarEdicaoMedico()" class="hidden bg-slate-100 text-slate-700 font-semibold px-4 py-3 rounded-xl text-xs">Cancelar</button>
                    </div>
                </form>
            </div>
        </section>

        <!-- TELA 3: PLANEJAMENTO -->
        <section id="view-planning" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                    <h2 id="plan-form-title" class="font-bold text-slate-900 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-calendar-days text-amber-600"></i> Planejamento Diário
                    </h2>
                </div>

                <form id="formPlanejamento" onsubmit="app.salvarPlanejamento(event)" class="space-y-3 text-sm">
                    <input type="hidden" id="planEditId">
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Selecione o Médico *</label>
                        <select id="planDoctorId" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Texto da Tarefa *</label>
                        <input type="text" id="planText" required placeholder="Ex: Entregar presente" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                    </div>
                    <div class="flex gap-2">
                        <button type="submit" class="flex-1 bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-xl text-xs flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-plus text-amber-400"></i> <span id="plan-btn-text">Adicionar Planejamento</span>
                        </button>
                        <button type="button" id="btnCancelarEdicaoPlan" onclick="app.cancelarEdicaoPlanejamento()" class="hidden bg-slate-100 text-slate-700 font-semibold px-4 py-3 rounded-xl text-xs">Cancelar</button>
                    </div>
                </form>
            </div>

            <div class="space-y-3">
                <div class="text-xs font-bold text-slate-500 uppercase tracking-wider px-1">Itens de Hoje</div>
                <div id="planning-list-container" class="space-y-3 pb-6"></div>
            </div>
        </section>

        <!-- TELA 4: RELATÓRIOS -->
        <section id="view-reports" class="hidden space-y-4">
            <div class="space-y-3">
                <button onclick="app.abrirModalSelecaoCompartilhar()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow-md flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-share-nodes"></i> Compartilhar Relatórios Selecionados
                </button>
                <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar">
                    <button onclick="app.setReportFilter('concluidos')" id="report-filter-concluidos" class="px-3.5 py-1.5 text-xs font-medium rounded-lg bg-slate-900 text-white whitespace-nowrap">Concluídos</button>
                    <button onclick="app.setReportFilter('pendentes')" id="report-filter-pendentes" class="px-3.5 py-1.5 text-xs font-medium rounded-lg bg-white border border-slate-200 text-slate-600 whitespace-nowrap">Pendentes</button>
                </div>
                <div id="reports-list-container" class="space-y-3 max-h-[55vh] overflow-y-auto pr-1 no-scrollbar"></div>
                <button onclick="app.abrirFormRelatorio()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-semibold py-3.5 rounded-xl shadow-md flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-plus-circle"></i> Adicionar Novo Relatório
                </button>
            </div>
        </section>
    </main>

    <!-- MODAL RELATÓRIO -->
    <div id="modalRelatorio" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
                <h3 id="modalRelatorioTitulo" class="font-bold text-base">Novo Relatório</h3>
                <button onclick="app.fecharModalRelatorio()" class="text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="formRelatorio" onsubmit="app.salvarRelatorio(event)" class="p-5 overflow-y-auto space-y-4 text-sm flex-1">
                <input type="hidden" id="reportId">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Título *</label>
                    <input type="text" id="reportTitle" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Médico *</label>
                    <select id="reportDoctorId" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Conteúdo *</label>
                    <textarea id="reportContent" rows="6" required class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl"></textarea>
                </div>
                <button type="submit" class="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl text-xs">Salvar Relatório</button>
            </form>
        </div>
    </div>

    <!-- MODAL SELEÇÃO COMPARTILHAR -->
    <div id="modalSelecaoCompartilhar" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="bg-slate-900 text-white p-4 flex items-center justify-between">
                <h3 class="font-bold text-base">Selecionar Relatórios para share.json</h3>
                <button onclick="app.fecharModalSelecaoCompartilhar()" class="text-slate-400 hover:text-white p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-5 overflow-y-auto space-y-3 text-sm flex-1">
                <div id="lista-checkbox-compartilhar" class="space-y-2"></div>
            </div>
            <div class="bg-slate-50 border-t border-slate-100 p-4 flex gap-2">
                <button onclick="app.enviarRelatoriosSelecionados()" class="flex-1 bg-emerald-600 text-white font-semibold py-3 rounded-xl text-xs">Atualizar share.json e Abrir</button>
            </div>
        </div>
    </div>

    <!-- MODAL ALERTA -->
    <div id="modalAlerta" class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 text-center space-y-4">
            <h4 id="alertaTitulo" class="font-bold text-slate-900 text-base">Aviso</h4>
            <p id="alertaTexto" class="text-xs text-slate-600 leading-relaxed"></p>
            <button onclick="app.fecharAlerta()" class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-xs">Entendido</button>
        </div>
    </div>

    <!-- NAVIGATION BAR -->
    <nav class="bg-white border-t border-slate-200 fixed bottom-0 left-0 right-0 z-30 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around py-2">
            <button onclick="app.mudarTela('list')" id="nav-btn-list" class="flex flex-col items-center flex-1 py-1 text-amber-600"><i class="fa-solid fa-address-book text-xl mb-0.5"></i><span class="text-[11px] font-semibold">Lista</span></button>
            <button onclick="app.mudarTela('clinics')" id="nav-btn-clinics" class="flex flex-col items-center flex-1 py-1 text-slate-400"><i class="fa-solid fa-hospital text-xl mb-0.5"></i><span class="text-[11px]">Clínicas</span></button>
            <button onclick="app.mudarTela('add')" id="nav-btn-add" class="flex flex-col items-center flex-1 py-1 text-slate-400"><i class="fa-solid fa-user-plus text-xl mb-0.5"></i><span class="text-[11px]">Novo</span></button>
            <button onclick="app.mudarTela('planning')" id="nav-btn-planning" class="flex flex-col items-center flex-1 py-1 text-slate-400"><i class="fa-solid fa-calendar-days text-xl mb-0.5"></i><span class="text-[11px]">Plan.</span></button>
            <button onclick="app.mudarTela('reports')" id="nav-btn-reports" class="flex flex-col items-center flex-1 py-1 text-slate-400"><i class="fa-solid fa-file-lines text-xl mb-0.5"></i><span class="text-[11px]">Relatórios</span></button>
        </div>
    </nav>

    <script>
        class OticaApp {
            constructor() {
                this.doctors = [];
                this.clinics = [];
                this.reports = [];
                this.planning = [];
                this.currentFilter = 'all';
                this.reportFilter = 'concluidos';
                this.clinicaSelecionada = null;
                this.initApp();
            }

            async initApp() {
                await this.loadData();
                this.renderList();
            }

            async loadData() {
                // 1. Tenta carregar dos arquivos JSON em data/ (portabilidade GitHub)
                try {
                    const [resMed, resCli, resPlan, resRep] = await Promise.all([
                        fetch('data/medicos/medicos.json').catch(() => null),
                        fetch('data/clinicas/clinicas.json').catch(() => null),
                        fetch('data/planejamentos/planejamentos.json').catch(() => null),
                        fetch('data/relatorios/relatorios.json').catch(() => null)
                    ]);

                    if (resMed && resMed.ok) this.doctors = await resMed.json();
                    if (resCli && resCli.ok) this.clinics = await resCli.json();
                    if (resPlan && resPlan.ok) this.planning = await resPlan.json();
                    if (resRep && resRep.ok) this.reports = await resRep.json();
                } catch(e) {
                    console.log('Sem dados nos JSONs do sistema, buscando fallback no navegador.');
                }

                // 2. Fallback / Leitura inicial do navegador se os JSONs estiverem vazios
                if (this.doctors.length === 0) {
                    this.doctors = JSON.parse(localStorage.getItem('otica_medicos_v5') || '[]');
                }
                if (this.clinics.length === 0) {
                    this.clinics = JSON.parse(localStorage.getItem('otica_clinicas_v1') || '[]');
                }
                if (this.planning.length === 0) {
                    this.planning = JSON.parse(localStorage.getItem('otica_planning_v1') || '[]');
                }
                if (this.reports.length === 0) {
                    this.reports = JSON.parse(localStorage.getItem('otica_reports_v3') || '[]');
                }
            }

            async migrarParaSistema() {
                // Verifica se há dados locais ou se já está operando puramente em sistema JSON
                const localDocs = localStorage.getItem('otica_medicos_v5');
                if (!localDocs) {
                    this.showAlert("Aviso", "Você não pode migrar os dados no momento ou os dados já estão no sistema.");
                    return;
                }

                // Simula o salvamento para os caminhos solicitados (data/medicos/, etc.)
                // Como app roda estático no GitHub Pages, geramos os blobs para download/sincronização automática ou salvos em localStorage unificado
                this.salvarTudoStorage();
                this.showAlert("Sucesso", "Dados migrados com sucesso para o sistema!", "sucesso");
            }

            salvarTudoStorage() {
                localStorage.setItem('otica_medicos_v5', JSON.stringify(this.doctors));
                localStorage.setItem('otica_clinicas_v1', JSON.stringify(this.clinics));
                localStorage.setItem('otica_planning_v1', JSON.stringify(this.planning));
                localStorage.setItem('otica_reports_v3', JSON.stringify(this.reports));
            }

            // --- PLANEJAMENTO: EDIÇÃO E EXCLUSÃO (APENAS SE NÃO MARCADO) ---
            salvarPlanejamento(e) {
                e.preventDefault();
                const idEdit = document.getElementById('planEditId').value;
                const doctorId = document.getElementById('planDoctorId').value;
                const text = document.getElementById('planText').value.trim();

                if (!doctorId || !text) return;

                if (idEdit) {
                    const item = this.planning.find(p => p.id === idEdit);
                    if (item && !item.checked) {
                        item.doctorId = doctorId;
                        item.text = text;
                    }
                    document.getElementById('planEditId').value = '';
                    document.getElementById('plan-btn-text').textContent = 'Adicionar Planejamento';
                    document.getElementById('btnCancelarEdicaoPlan').classList.add('hidden');
                } else {
                    const novoItem = {
                        id: 'plan_' + Date.now(),
                        doctorId,
                        text,
                        dayGroup: 'Hoje',
                        checked: false
                    };
                    this.planning.unshift(novoItem);
                }

                this.salvarTudoStorage();
                document.getElementById('formPlanejamento').reset();
                this.renderPlanningList();
            }

            editarPlanejamento(id) {
                const item = this.planning.find(p => p.id === id);
                if (!item || item.checked) {
                    this.showAlert("Aviso", "Itens marcados não podem ser editados.");
                    return;
                }
                document.getElementById('planEditId').value = item.id;
                document.getElementById('planDoctorId').value = item.doctorId;
                document.getElementById('planText').value = item.text;
                document.getElementById('plan-btn-text').textContent = 'Salvar Edição';
                document.getElementById('btnCancelarEdicaoPlan').classList.remove('hidden');
            }

            cancelarEdicaoPlanejamento() {
                document.getElementById('planEditId').value = '';
                document.getElementById('formPlanejamento').reset();
                document.getElementById('plan-btn-text').textContent = 'Adicionar Planejamento';
                document.getElementById('btnCancelarEdicaoPlan').classList.add('hidden');
            }

            excluirPlanejamento(id) {
                const item = this.planning.find(p => p.id === id);
                if (!item || item.checked) {
                    this.showAlert("Aviso", "Itens marcados não podem ser apagados.");
                    return;
                }
                this.planning = this.planning.filter(p => p.id !== id);
                this.salvarTudoStorage();
                this.renderPlanningList();
            }

            togglePlanningItem(id) {
                const item = this.planning.find(p => p.id === id);
                if (!item || item.checked) return;

                item.checked = true;
                this.salvarTudoStorage();

                // Gera relatório pendente automaticamente
                const novoRelatorio = {
                    id: 'rep_' + Date.now(),
                    title: 'Relatório Automático',
                    date: new Date().toISOString().split('T')[0],
                    doctorId: item.doctorId,
                    content: `Planejamento concluído: "${item.text}".`,
                    isPending: true
                };
                this.reports.unshift(novoRelatorio);
                this.salvarTudoStorage();
                this.renderPlanningList();
            }

            renderPlanningList() {
                const container = document.getElementById('planning-list-container');
                if (!container) return;

                if (this.planning.length === 0) {
                    container.innerHTML = `<div class="bg-white p-6 text-center text-xs text-slate-500 rounded-2xl">Nenhum planejamento cadastrado.</div>`;
                    return;
                }

                let html = '';
                this.planning.forEach(item => {
                    const doc = this.doctors.find(d => d.id === item.doctorId);
                    const docName = doc ? doc.name : 'Médico';
                    const disabledAttr = item.checked ? 'checked disabled' : '';

                    html += `
                        <div class="flex items-center justify-between p-3 rounded-xl border bg-white shadow-2xs">
                            <div class="flex items-center gap-3 flex-1">
                                <input type="checkbox" ${disabledAttr} onchange="app.togglePlanningItem('${item.id}')" class="w-4 h-4 text-amber-600 rounded">
                                <div>
                                    <p class="text-xs font-semibold text-slate-900">${docName}</p>
                                    <p class="text-xs text-slate-700">${item.text}</p>
                                </div>
                            </div>
                            <div class="flex items-center gap-1">
                                ${!item.checked ? `
                                    <button onclick="app.editarPlanejamento('${item.id}')" class="p-1.5 text-slate-600 hover:text-amber-600 text-xs"><i class="fa-solid fa-pen"></i></button>
                                    <button onclick="app.excluirPlanejamento('${item.id}')" class="p-1.5 text-rose-500 hover:text-rose-700 text-xs"><i class="fa-solid fa-trash"></i></button>
                                ` : '<span class="text-[10px] text-emerald-800 bg-emerald-50 px-2 py-1 rounded">Concluído</span>'}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }

            // --- COMPARTILHAMENTO PARA SHARE.JSON ---
            enviarRelatoriosSelecionados() {
                const checkboxes = document.querySelectorAll('.checkbox-compartilhar:checked');
                const relatoriosSelecionados = [];
                checkboxes.forEach(cb => {
                    const rep = this.reports.find(r => r.id === cb.value);
                    if (rep) relatoriosSelecionados.push(rep);
                });

                const payloadShare = {
                    ultimosRelatorios: relatoriosSelecionados,
                    relatorios: this.reports,
                    atualizadoEm: new Date().toISOString()
                };

                // Cria o arquivo virtual para download/atualização do share.json
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payloadShare, null, 2));
                const downloadAnchor = document.createElement('a');
                downloadAnchor.setAttribute("href", dataStr);
                downloadAnchor.setAttribute("download", "share.json");
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                downloadAnchor.remove();

                window.open('share.html', '_blank');
                this.fecharModalSelecaoCompartilhar();
            }

            abrirModalSelecaoCompartilhar() {
                const container = document.getElementById('lista-checkbox-compartilhar');
                let html = '';
                this.reports.forEach(r => {
                    html += `
                        <label class="flex items-center gap-2 p-2 bg-slate-50 rounded-xl cursor-pointer">
                            <input type="checkbox" value="${r.id}" class="checkbox-compartilhar w-4 h-4 text-emerald-600 rounded">
                            <span class="text-xs font-medium text-slate-800">${r.title} - ${r.content.substring(0, 40)}...</span>
                        </label>
                    `;
                });
                container.innerHTML = html || '<p class="text-xs text-slate-500">Nenhum relatório disponível.</p>';
                document.getElementById('modalSelecaoCompartilhar').classList.remove('hidden');
            }

            fecharModalSelecaoCompartilhar() {
                document.getElementById('modalSelecaoCompartilhar').classList.add('hidden');
            }

            mudarTela(tela) {
                ['list', 'clinics', 'add', 'planning', 'reports'].forEach(t => {
                    document.getElementById(`view-${t}`).classList.add('hidden');
                });
                document.getElementById(`view-${tela}`).classList.remove('hidden');
                if (tela === 'planning') this.renderPlanningList();
            }

            showAlert(titulo, texto) {
                document.getElementById('alertaTitulo').textContent = titulo;
                document.getElementById('alertaTexto').textContent = texto;
                document.getElementById('modalAlerta').classList.remove('hidden');
            }

            fecharAlerta() {
                document.getElementById('modalAlerta').classList.add('hidden');
            }

            renderList() { /* Renderização simplificada da lista */ }
        }

        const app = new OticaApp();
    </script>
</body>
</html>
